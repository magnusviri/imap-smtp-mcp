version: "3.8"

services:
  imap-smtp-mcp:
    image: ${IMAP_SMTP_MCP_IMAGE:?set the locally built or registry image tag}
    ports:
      - target: 8787
        published: 8787
        protocol: tcp
        mode: host
    environment:
      IMAP_SMTP_MCP_CONFIG: /config/config.toml
      IMAP_SMTP_MCP_TOKEN_FILE: /run/secrets/mcp-bearer-token
      IMAP_SMTP_MCP_STATE_DIR: /state
      IMAP_SMTP_MCP_TLS_CERT_FILE: /tls/cert.pem
      IMAP_SMTP_MCP_TLS_KEY_FILE: /run/secrets/tls-private-key
    volumes:
      - ${IMAP_SMTP_MCP_CONFIG_FILE:?set the absolute config file path}:/config/config.toml:ro
      - ${IMAP_SMTP_MCP_TLS_CERT_FILE:?set the absolute TLS certificate path}:/tls/cert.pem:ro
      - imap-smtp-mcp-state:/state
    secrets:
      - source: mcp-bearer-token
        target: mcp-bearer-token
      # This target must match config/config.toml's secret_ref = "imap-smtp".
      - source: imap-smtp
        target: imap-smtp
      - source: tls-private-key
        target: tls-private-key
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

secrets:
  mcp-bearer-token:
    external: true
  imap-smtp:
    external: true
  tls-private-key:
    external: true

volumes:
  imap-smtp-mcp-state:
