[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imap-smtp-mcp"
version = "0.1.0"
description = "A private, local MCP server for IMAP/SMTP email"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=2.2.0,<3",
  "keyring>=25,<26",
  "keyrings.alt>=5,<6",
  "pydantic>=2.12,<3",
  "pycryptodome>=3.20,<4",
  "uvicorn>=0.30,<1",
  "tomli>=2.2,<3; python_version < '3.11'",
]

[project.scripts]
imap-smtp-mcp = "imap_smtp_mcp.server:main"
imap-smtp-mcp-validate = "imap_smtp_mcp.config:validate_main"
imap-smtp-mcp-store-secret = "imap_smtp_mcp.secrets:store_main"
imap-smtp-mcp-generate-manifest = "imap_smtp_mcp.manifest:generate_main"
imap-smtp-mcp-check-manifest = "imap_smtp_mcp.manifest:check_main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/imap_smtp_mcp"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
