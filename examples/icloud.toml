# iCloud Mail. Store an Apple app-specific password under this Keychain reference.
[server]
keychain_service = "imap-smtp-mcp"

[[accounts]]
id = "icloud-imap"
type = "imap-smtp"
sender_addresses = ["you@icloud.com"]
mailboxes = ["INBOX", "Sent Messages", "Drafts"]
username = "you@icloud.com"
secret_ref = "icloud-mail-app-password"

[accounts.imap]
host = "imap.mail.me.com"
port = 993
tls = true

[accounts.smtp]
host = "smtp.mail.me.com"
port = 587
tls = true
starttls = true

[accounts.outbound_policy]
allowed_recipients = ["test-recipient@example.net"]
attachment_root = "/Users/YOU/Documents/Mail Attachments"
