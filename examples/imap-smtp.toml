[server]
request_timeout_seconds = 30
keychain_service = "personal-mail-mcp"

[[accounts]]
id = "personal"
type = "imap-smtp"
sender_addresses = ["owner@example.com"]
mailboxes = ["INBOX", "Archive", "Sent", "Drafts"]
username = "owner@example.com"
secret_ref = "personal-imap-smtp"

[accounts.imap]
host = "imap.example.com"
port = 993
tls = true

[accounts.smtp]
host = "smtp.example.com"
port = 465
tls = true

[accounts.outbound_policy]
# Opt in only when unrestricted delivery is intended. This overrides the
# recipient and domain allowlists below.
# allow_any_recipient = true
allowed_recipients = ["test-recipient@example.net"]
allowed_recipient_domains = ["example.org"]
attachment_root = "/Users/YOU/Documents/Mail Attachments"
max_attachment_bytes = 10485760
rate_limit_messages = 20
rate_limit_window_seconds = 3600
