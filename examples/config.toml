# Multi-account IMAP/SMTP configuration. Replace placeholders before use.
# Every [[accounts]] block has one credential. Its secret_ref must be unique:
# it is the Keychain entry for local runs and the credential filename for Docker.

[server]
request_timeout_seconds = 30
keychain_service = "imap-smtp-mcp"

[[accounts]]
id = "imap-smtp"
type = "imap-smtp"
sender_addresses = ["you@example.com"]
mailboxes = ["INBOX", "Archive", "Sent"]
username = "you@example.com"
# Local Keychain entry or Docker credential filename: imap-smtp
secret_ref = "imap-smtp"

[accounts.imap]
host = "imap.example.com"
port = 993
tls = true

[accounts.smtp]
host = "smtp.example.com"
port = 465
tls = true

[accounts.outbound_policy]
allow_any_recipient = true

[[accounts]]
id = "work"
type = "imap-smtp"
sender_addresses = ["you@work.example"]
mailboxes = ["INBOX", "Projects", "Sent Items"]
username = "you@work.example"
# Local Keychain entry or Docker credential filename: work-imap-smtp
secret_ref = "work-imap-smtp"
auth_mode = "oauth2"

[accounts.imap]
host = "imap.work.example"
port = 993
tls = true

[accounts.smtp]
host = "smtp.work.example"
port = 465
tls = true

[accounts.outbound_policy]
# authorization and rely only on allowed_recipients.
allowed_recipients = ["trusted-colleague@work.example"]
# Omit this setting, or use an empty list, to disable domain-based recipient
allowed_recipient_domains = []
